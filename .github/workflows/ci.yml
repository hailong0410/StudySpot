name: StudySpot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, sprint4-live-signal]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-ci-lock.txt
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy app.py domain.py scripts/build_artifact.py --ignore-missing-imports --check-untyped-defs
      - name: Unit tests
        run: python -m pytest -q -m "not integration"
      - name: Integration tests
        run: python -m pytest -q -m integration
      - name: Coverage report
        run: python -m pytest -q --cov=app --cov=domain --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=70
      - name: Branch coverage gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("coverage.json").read_text())
          gates = [("Overall", data["totals"], 70)]
          gates.extend((name, data["files"][name]["summary"], 85) for name in ("app.py", "domain.py"))
          for label, summary, target in gates:
              total = summary["num_branches"]
              actual = 100 * summary["covered_branches"] / total if total else 100
              print(f"{label} branch coverage: {actual:.2f}% (target {target}%)")
              if actual < target:
                  raise SystemExit(f"{label} branch coverage is below target")
          PY

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          python -m pip install bandit==1.9.4 pip-audit==2.10.1
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Static analysis (High)
        if: ${{ !cancelled() }}
        run: python -m bandit app.py domain.py scripts/build_artifact.py --severity-level high
      - name: Dependency audit (runtime and CI)
        if: ${{ !cancelled() }}
        run: |
          result=0
          for lockfile in requirements-runtime-lock.txt requirements-ci-lock.txt; do
            python -m pip_audit -r "$lockfile" --no-deps --disable-pip || result=1
          done
          exit "$result"
      - name: Secret scan (whole history)
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all'

  publish-artifact:
    needs: [checks, security, container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build versioned runnable application
        run: python scripts/build_artifact.py --version "${{ github.sha }}"
      - name: Publish versioned application artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: StudySpot-${{ github.sha }}
          path: dist/StudySpot-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify the runtime
        env:
          STUDYSPOT_LOCAL_PORT: "5000"
        run: |
          export COMMIT_SHA="$GITHUB_SHA"
          docker compose build --build-arg COMMIT_SHA="$COMMIT_SHA"
          docker compose up -d --wait --wait-timeout 90
          test "$(docker compose exec -T app id -u)" = "10001"
          python scripts/smoke.py http://127.0.0.1:5000 "$COMMIT_SHA"
      - name: Export verified Docker image
        if: github.event_name == 'pull_request'
        run: |
          image_id=$(docker compose images -q app)
          docker image tag "$image_id" studyspot:sprint5
          docker image save studyspot:sprint5 | gzip -n > StudySpot-Docker-amd64.tar.gz
          docker image rm studyspot:sprint5
          docker image load --input StudySpot-Docker-amd64.tar.gz
          test "$(docker image inspect --format '{{.Id}}' studyspot:sprint5)" = "$(docker image inspect --format '{{.Id}}' "$image_id")"
      - name: Upload verified Docker image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: StudySpot-Docker-amd64
          path: StudySpot-Docker-amd64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Remove test services
        if: always()
        run: docker compose down --volumes

  publish-image:
    needs: [checks, security, container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish commit image and capture registry digest
        id: publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --build-arg "COMMIT_SHA=$GITHUB_SHA" \
            --tag "$image:$GITHUB_SHA" --push --metadata-file "$RUNNER_TEMP/image.json" .
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/image.json")
          echo "image=$image@$digest" >> "$GITHUB_OUTPUT"

  staging:
    needs: [publish-image]
    if: vars.ENABLE_STAGING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy immutable image
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/remote-deploy.sh "$IMAGE"
      - name: Run authenticated staging smoke tests
        env:
          APP_URL: ${{ vars.APP_URL }}
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python scripts/smoke.py "$APP_URL" "$GITHUB_SHA" --authenticated --record
      - name: Record tested image
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          jq -n --arg image "$IMAGE" --arg commit "$GITHUB_SHA" --arg version "$(cat VERSION)"             '{image:$image,commit:$commit,version:$version}' > staged-image.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: staged-image-${{ github.sha }}
          path: staged-image.json
          if-no-files-found: error
          retention-days: 30
